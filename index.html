/* 「先輩の記録として残す」ボタンは置かない。
   ログインしていれば、組んだ時間割がそのまま
   「その学科・その学年の履修記録」として統計に入る。 */
function openPicker(d,p){ picking = {d,p,q:"",hideNG:true}; drawPicker(); }
document.addEventListener("keydown", e=>{
  if(e.key==="Escape" && picking){ picking=null; drawPicker(); }
});
function pickerCands(){
  const {d,p,q,hideNG} = picking;
  return DATA.courses.filter(c=>{
    if(c.year!==state.year) return false;
    if(c.day!==d || c.period!==p) return false;
    if(!inTerm(c,term)) return false;
    if(hideNG && judge(c).cls==="no") return false;
    if(q){ const s=(c.title+" "+c.teacher+" "+c.kubun).toLowerCase();
           if(!s.includes(q.toLowerCase())) return false; }
    return true;
  }).map(c=>({c, ...recoScore(c)}))
    .sort((a,b)=>b.score-a.score || a.c.title.localeCompare(b.c.title,"ja"));
}
/* ── この枠のおすすめ順 ──────────────────────
   先輩の履修記録がいちばん強い手がかり。自分と同じ学科・学年の人がどれだけ取ったか、
   次に学科全体、最後に星。理由を文にして一緒に返す。 */
function recoScore(c){
  const k=key(c), reasons=[];
  let score=0;
  if(ME.dept && ME.grade){
    const same=RECORDS.filter(r=>r.dept===ME.dept && String(r.grade)===String(ME.grade));
    if(same.length>=3){
      const n=same.filter(r=>r.courses.includes(k)).length;
      const pct=n/same.length*100;
      score += pct*3;
      if(pct>=15) reasons.push({t:`${ME.dept} ${gname(ME.grade)}の <b>${pct.toFixed(0)}%</b> が履修`, w:1});
    }
  }
  if(ME.dept){
    const dp=RECORDS.filter(r=>r.dept===ME.dept);
    if(dp.length>=5){
      const took=dp.filter(r=>r.courses.includes(k));
      score += (took.length/dp.length*100);
      /* 学年を全部並べても情報にならない。いちばん多い学年とその割合だけ出す */
      if(took.length>=3){
        const byG={}, denG={};
        dp.forEach(r=>{ denG[r.grade]=(denG[r.grade]||0)+1; });
        took.forEach(r=>{ byG[r.grade]=(byG[r.grade]||0)+1; });
        const best=Object.entries(byG)
          .map(([g,n])=>({g, n, pct:n/(denG[g]||1)*100}))
          .filter(x=>denG[x.g]>=3)
          .sort((a,b)=>b.pct-a.pct)[0];
        if(best && best.pct>=12 && String(best.g)!==String(ME.grade))
          reasons.push({t:`${ME.dept}科の先輩は <b>${best.g}年</b>で取る人が多い（${best.pct.toFixed(0)}%）`, w:.6});
      }
    }
  }
  /* この講義をいちばん多く取っている学科 */
  const tb=takenBy(c);
  if(tb.length){
    const top=tb[0];
    if(top.pct>=25 && (!ME.dept || top.dept!==ME.dept))
      reasons.push({t:`いちばん多いのは <b>${top.dept}科${top.grade}年</b>（${top.pct.toFixed(0)}%）`, w:.4});
  }
  const a=agg(c);
  if(a){ score += a.avg*8 + Math.min(a.n,20)*0.6;
    if(a.n>=3) reasons.push({t:`口コミ ${a.n}件で ★${a.avg.toFixed(1)}`, w:.5}); }
  return {score, reasons:reasons.sort((x,y)=>y.w-x.w).slice(0,2)};
}
function drawPicker(){
  if(!picking){ document.getElementById("pickwrap").innerHTML=""; return; }
  const {d,p} = picking;
  const cands = pickerCands();
  const rows = cands.length ? cands.map(({c,reasons},i)=>{
    const j=judge(c), a=agg(c);
    return `<div class="pkitem" data-k="${esc(key(c))}">
      <div><div class="t"><span class="rk">${i+1}</span>${esc(c.title)}</div>
        <div class="m">${esc(c.kubun)}${c.teacher?" ／ "+esc(c.teacher):""}
          ${c.credits?" ／ "+c.credits+"単位":""} ／ ${esc(c.term)}</div>
        ${reasons.length?`<div class="why">${reasons.map(r=>`<span>${r.t}</span>`).join("")}</div>`:""}</div>
      ${a?`<div class="right">${starHTML(a.avg)}
        <span class="num">${a.avg.toFixed(1)}</span> <span>(${a.n})</span></div>`:""}
      <span class="v ${j.cls}">${j.label}</span>
    </div>`;
  }).join("") : `<div class="pkempty">この枠に置ける授業が見つかりませんでした。<br>
      「履修できないものも表示」を入れると増えることがあります。<br><br>
      <span style="font-size:11.5px;line-height:1.9">工芸・油画・日本画などの<b>実技科目は、シラバスに曜日・時限が設定されていません</b>。<br>
      終日の工房作業でコマに割り当てられていないためで、ここには出てきません。<br>
      「さがす」から開いて「時間割に足す」で別枠に入れられます。</span></div>`;
  document.getElementById("pickwrap").innerHTML = `<div class="pkback"></div><div class="picker">
    <div class="pkhead">
      <h3>${d}曜 ${p}限</h3><span style="font-size:11.5px;color:var(--sub)">${term}</span>
      <span class="cnt">${cands.length}件${ME.dept?` ／ ${esc(ME.fac)} ${esc(ME.dept)} ${ME.grade?gname(ME.grade):""} で判定`:"　アカウントで所属を選ぶと絞れます"}</span>
      <button class="close">×</button>
    </div>
    <div class="pkfilter">
      <input type="text" id="pkq" placeholder="この枠のなかを絞り込む" value="${esc(picking.q)}">
      <label><input type="checkbox" id="pkng" ${picking.hideNG?"":"checked"}>履修できないものも表示</label>
    </div>
    <div class="pklist">${rows}</div></div>`;

  const shut = ()=>{ picking=null; drawPicker(); };
  document.querySelector(".picker .close").onclick = shut;
  document.querySelector(".pkback").onclick = shut;
  const qi = document.getElementById("pkq");
  qi.oninput = ()=>{ picking.q=qi.value; const s=qi.selectionStart; drawPicker();
    const n=document.getElementById("pkq"); n.focus(); n.setSelectionRange(s,s); };
  document.getElementById("pkng").onchange = e=>{ picking.hideNG=!e.target.checked; drawPicker(); };
  document.querySelectorAll(".pkitem").forEach(it=>{
    it.onclick = ()=>{
      const c = byKey[it.dataset.k];
      const terms = c.term==="通年" ? ["前期","後期"] : [c.term];
      const clash = terms.filter(t=>TT[ttk(t,d,p)] && TT[ttk(t,d,p)]!==it.dataset.k);
      if(clash.length && !confirm(`${clash.join("・")}の${d}${p}限には別の授業が入っています。置きかえますか？`)) return;
      terms.forEach(t=>{ TT[ttk(t,d,p)] = it.dataset.k; });
      SS("geidai_tt_v1",TT); picking=null; renderTT(); drawPicker();
    };
  });
}

function detailHTML(c){
  const j = judge(c);
  const seen=new Set();
  const notes = (c.restrictions||[]).filter(r=>{
    const k=r.kind+"|"+r.source; if(seen.has(k)) return false; seen.add(k); return true;
  }).map(r=>{
    const NT={GRAD:"大学院向けの科目です。",UNDER:"",ANY:""};
    const body = NT[r.note]!==undefined ? NT[r.note] : (r.note||"");
    return `<div class="note"><div class="k">${esc(KIND_LABEL[r.kind]||r.kind)}${r.target?" — "+esc(r.target):""}</div>
      ${body?`<div class="t">${esc(body)}</div>`:""}
      <div class="src">根拠（${esc(r.source_field)}）：${esc(r.source)}</div></div>`;
  }).join("");
  const canAdd = c.day && c.period;
  const terms = c.term==="通年"?["前期","後期"]:[c.term];

function openDetail(li,c){
  const d = li.querySelector(".detail");

      const clash = terms.filter(t=>TT[ttk(t,c.day,c.period)] && TT[ttk(t,c.day,c.period)]!==key(c));
      if(clash.length && !confirm(`${clash.join("・")}の${c.day}${c.period}限には別の授業が入っています。置きかえますか？`)) return;
      terms.forEach(t=>{ TT[ttk(t,c.day,c.period)] = key(c); });
    } else {
      terms.forEach(t=>{ TT[`${ttGrade}|${t}|*${key(c)}`] = key(c); });

  };
  // タグ編集
  d.querySelectorAll("[data-dt]").forEach(b=> b.onclick=()=>{
    const f=FAVS[key(c)]; f.tags=(f.tags||[]).filter(t=>t!==b.dataset.dt);
    SS("geidai_favs_v1",FAVS); openDetail(li,c); });
  const addTag = d.querySelector("[data-addtag]");
  if(addTag) addTag.onclick = ()=>{
    const inp=d.querySelector(".newtag"), v=inp.value.trim(); if(!v) return;
    const f=FAVS[key(c)]; f.tags=[...new Set([...(f.tags||[]),v])];
    SS("geidai_favs_v1",FAVS); openDetail(li,c); };
  // 学科で絞る
  const only = d.querySelector(".deptonly");
  if(only) only.onchange = e=>{ rvDeptOnly=e.target.checked; openDetail(li,c); };
  // 口コミ削除（消せるのは自分が書いたものだけ）
  d.querySelectorAll("[data-at]").forEach(b=> b.onclick=()=>{
    if(!confirm("この口コミを削除しますか？")) return;
    const k=key(c), at=Number(b.dataset.at);
    const gone=(MINE[k]||[]).find(r=>r.at===at);
    MINE[k]=(MINE[k]||[]).filter(r=>r.at!==at);
    if(!MINE[k].length) delete MINE[k];
    SS("geidai_reviews_v2",MINE);
    if(gone && gone.id && typeof GAPI!=="undefined") GAPI.delReview(gone.id).catch(()=>{});
    rebuild(); openDetail(li,c);
    li.querySelector(".right").innerHTML =
      `<span class="v ${judge(c).cls}">${judge(c).label}</span>${rateHTML(c)}`; });
  // 投稿
  let star=0, tags=[];
  d.querySelectorAll(".pick.star button").forEach(b=> b.onclick=()=>{
    star=Number(b.dataset.v);
    d.querySelectorAll(".pick.star button").forEach(x=>
      x.classList.toggle("on", Number(x.dataset.v)<=star)); });
  d.querySelectorAll(".chipset button").forEach(b=> b.onclick=()=>{
    const t=b.dataset.t;
    if(tags.includes(t)){ tags=tags.filter(x=>x!==t); b.classList.remove("on"); }
    else { tags.push(t); b.classList.add("on"); } });
  d.querySelector(".submit").onclick = ()=>{
    if(!star){ alert("総合の星を選んでください。"); return; }
    const k=key(c);
    const rv = { star,
      ease:Number(d.querySelector(".ease").value)||0,
      year:d.querySelector(".year").value||"",
      dept:d.querySelector(".rdept").value||"",
      grade:d.querySelector(".rgrade").value||"",
      tags, body:d.querySelector("textarea").value.trim(),
      at:Date.now(), mine:true };
    /* まず手元に入れて画面を更新する。サーバへは裏で送る。
       送れなくても画面は止めない（届かなかったぶんは api.js が貯めて後で送る）。 */
    (MINE[k]=MINE[k]||[]).push(rv);
    SS("geidai_reviews_v2",MINE); rebuild(); openDetail(li,c);
    li.querySelector(".right").innerHTML =
      `<span class="v ${judge(c).cls}">${judge(c).label}</span>${rateHTML(c)}`;
    if(typeof GAPI!=="undefined") GAPI.putReview({...rv, k}).catch(()=>{}); };
}

function match(c){
  if(state.year && c.year!==state.year) return false;
  if(state.kubun && c.kubun!==state.kubun) return false;
  if(state.term && c.term!==state.term) return false;
  if(state.campus && c.campus!==state.campus) return false;
  if(state.day && c.day!==state.day) return false;
  if(state.q){
    const q=state.q.toLowerCase();
    if(![c.title,c.subtitle,c.gakusoku,c.code,c.teacher,c.teacher_actual]
        .join(" ").toLowerCase().includes(q)) return false;
  }
  return true;
}
/* 並べ替え用の点。C件ぶんの「全体平均」を下駄として足してから割る。
   口コミ1件の5.0 → 4.2くらい、40件の4.7 → ほぼ4.7 のままになる。 */
const PRIOR_N = 5;
let PRIOR_AVG = null;
function priorAvg(){
  if(PRIOR_AVG!=null) return PRIOR_AVG;
  let s=0,n=0;
  DATA.courses.forEach(c=>{ const a=agg(c); if(a&&a.n){ s+=a.avg*a.n; n+=a.n; } });
  return (PRIOR_AVG = n ? s/n : 3.8);
}
function score(a){
  if(!a || !a.n) return 0;
  const p=priorAvg();
  return (a.avg*a.n + p*PRIOR_N) / (a.n + PRIOR_N);
}
function renderFind(){
  let all = DATA.courses.filter(match);
  all = all.slice().sort((a,b)=>{
    const A=agg(a),B=agg(b);
    if(state.sort==="reviews") return (B?B.n:0)-(A?A.n:0);
    if(state.sort==="ease")    return (B?B.ease:0)-(A?A.ease:0);
    if(state.sort==="name")    return a.title.localeCompare(b.title,"ja");
    if(state.sort==="slot"){
      const s=x=>x.day?DAYS.indexOf(x.day)*10+x.period:99;
      return s(a)-s(b) || a.title.localeCompare(b.title,"ja");
    }
    /* 「評価が高い順」を素の平均でやると、口コミ1件の5.0が
       口コミ40件の4.7より上に来てしまう。それは順位として嘘になる。
       全体平均に向かって引き戻す（件数が増えるほど自分の平均に近づく）。 */
    return score(B)-score(A) || (B?B.n:0)-(A?A.n:0);
  });
  document.getElementById("count").innerHTML =
    `<b>${all.length}</b>件${state.day?` ／ ${state.day}曜`:""}`;
  const el = document.getElementById("list");
  if(!all.length){
    el.innerHTML=`<div class="empty">条件に合う授業がありません</div>`;
    document.getElementById("more").style.display="none"; return;
  }
  const page = all.slice(0,shown);
  el.innerHTML = page.map((c,i)=>rowHTML(c,i)).join("");
  bindRows(el,page);
  document.getElementById("more").style.display = all.length>shown?"block":"none";
}

    document.querySelectorAll("#termseg button").forEach(x=>x.classList.toggle("on",x===b));
    picking=null; drawPicker(); renderTT(); });

  document.getElementById("fyear").onchange=e=>{state.year=e.target.value.replace("年度","");state.kubun="";shown=40;refresh();};
  document.getElementById("fkubun").onchange=e=>{state.kubun=e.target.value;shown=40;renderFind();};
  document.getElementById("fterm").onchange=e=>{state.term=e.target.value;shown=40;renderFind();};
  document.getElementById("fcampus").onchange=e=>{state.campus=e.target.value;shown=40;renderFind();};
  document.getElementById("fday").onchange=e=>{state.day=e.target.value;shown=40;renderFind();};
  document.getElementById("fsort").onchange=e=>{state.sort=e.target.value;shown=40;renderFind();};
  let t0; document.getElementById("q").oninput=e=>{ clearTimeout(t0);
    t0=setTimeout(()=>{state.q=e.target.value.trim();shown=40;renderFind();},180); };
  document.getElementById("more").onclick=()=>{shown+=40;renderFind();};
  if(typeof bindTeacherSearch==="function") bindTeacherSearch();
  /* 教員ページから科目に飛ぶ */
  window.__openCourse = k => {
    const c = byKey[k]; if(!c) return;
    state.q=c.title; state.year=c.year; state.kubun=""; state.term=""; state.day="";
    document.getElementById("q").value=c.title; shown=40;
    go("find"); refresh();
    setTimeout(()=>{ const li=document.querySelector("#list li.row");
      if(li && !li.classList.contains("open")) li.click(); },60);
  };
  refresh();
});
</script>
</body>
</html>
